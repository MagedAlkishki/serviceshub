<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ServiceHub - Log In</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <nav>
        <a class="brand" href="/">ServiceHub</a>
        <div class="links">
            <a href="/signup.html">Sign up</a>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">&#127761;</button>
        </div>
    </nav>

    <main>
        <div class="card">
            <h1>Log in</h1>
            <p class="subtitle">Access your subscribed services.</p>

            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">

                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">

                <button type="submit" class="primary">Log in</button>
            </form>

            <div id="message" class="message"></div>

            <p class="foot-link">No account yet? <a href="/signup.html">Sign up</a></p>
        </div>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            message.className = "message";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const body = await response.json();
                    throw new Error(body.error || "Login failed");
                }

                window.location.href = "/dashboard.html";
            } catch (err) {
                message.textContent = err.message;
                message.className = "message error";
            }
        });
    </script>
</body>
</html>
